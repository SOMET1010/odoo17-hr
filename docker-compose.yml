# Instance Odoo 17 locale pour faire tourner les modules ANSUT.
#
# À la différence du workflow .github/workflows/test-install.yml, qui vérifie
# seulement que les modules s'installent puis s'arrête, cette pile reste
# allumée : interface accessible sur http://localhost:8069, base et filestore
# persistants entre deux démarrages.
#
# Voir DOCKER.md pour la mise en route et le branchement de l'atelier React.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    # Derrière la passerelle, Odoo doit savoir qu'il l'est : sans « proxy-mode »
    # il fabrique ses URL en http:// et prend l'adresse du proxy pour celle du
    # visiteur. L'option n'est PAS mise par défaut : activée sur une instance
    # directement exposée, elle ferait confiance à des en-têtes que n'importe
    # qui pourrait forger. deployer/installer.sh la pose avec la passerelle.
    command: odoo ${ODOO_OPTIONS:-}
    ports:
      # N'écoute que sur la machine elle-même. Sur un serveur avec une IP
      # publique, « 8069:8069 » exposerait Odoo à Internet ; il faut alors un
      # tunnel SSH ou un proxy inverse devant, ce qui est le comportement
      # voulu par défaut. BIND_ODOO permet de l'ouvrir sciemment — et
      # n'ouvre que l'interface, jamais le service d'installation.
      - "${BIND_ODOO:-127.0.0.1}:8069:8069"
      # Communication temps réel (chatter, notifications)
      - "${BIND_ODOO:-127.0.0.1}:8072:8072"
    volumes:
      # Filestore et sessions : sans ce volume, les pièces jointes et la
      # session sont perdues à chaque recréation du conteneur.
      - odoo-data:/var/lib/odoo
      # Les modules du dépôt, en lecture seule : Odoo ne doit pas les modifier.
      - ./:/mnt/extra-addons:ro
      # Les modules déposés par le service d'installation. Volume distinct des
      # sources Git, et monté en lecture seule ici : seul le service écrit.
      - addons-installes:/mnt/addons-installes:ro
      # Addons Odoo Enterprise, quand on en dispose. Sous licence OEEL-1 : ils
      # ne sont ni versionnés ni copiés dans une image, seulement montés depuis
      # un dossier de la machine, en lecture seule. À défaut, un dossier vide
      # du dépôt occupe la place, pour que le chemin existe toujours.
      - ${ADDONS_ENTREPRISE:-./.docker/entreprise-absente}:/mnt/entreprise:ro
      # Vos modules de production. Hors du dépôt eux aussi : les y verser les
      # soumettrait à son historique et empêcherait le service d'installation
      # d'en déposer une version corrigée — il refuse d'écraser une source Git.
      - ${ADDONS_MAISON:-./.docker/maison-absente}:/mnt/maison:ro
      - ./.docker/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

  # Service privé d'installation de modules. Sous profil : « docker compose
  # up » ne le démarre pas, il faut le demander explicitement par
  # « docker compose --profile installateur up -d installateur ».
  #
  # Il n'a délibérément pas accès au socket Docker : il écrit un volume et
  # parle HTTP à Odoo, rien de plus.
  installateur:
    build: ./.docker/service-installation
    profiles: ["installateur"]
    depends_on:
      - odoo
    environment:
      # À surcharger : le service refuse de démarrer sans clé.
      CLE_API: ${INSTALLATEUR_CLE_API:-cle-de-developpement}
      ODOO_URL: http://odoo:8069
      ODOO_BASE: ${INSTALLATEUR_BASE:-ansut}
      ODOO_LOGIN: admin
      ODOO_MOTDEPASSE: ${ODOO_ADMIN_MOTDEPASSE:-admin}
      TAILLE_MAX_MO: "20"
    ports:
      # Le service d'installation installe du code : il ne doit jamais être
      # joignable depuis l'extérieur de la machine. L'adresse est écrite en
      # dur, sans variable : ouvrir Odoo ne doit pas pouvoir ouvrir ceci par
      # ricochet.
      - "127.0.0.1:8090:8090"
    volumes:
      - addons-installes:/mnt/addons-installes
      # Les sources Git en lecture seule : sert uniquement à refuser
      # l'écrasement d'un module livré par le dépôt.
      - ./:/mnt/extra-addons:ro
    restart: unless-stopped

  # API de l'Atelier : la surface que l'interface appelle.
  #
  # Elle ne publie AUCUN port. On ne l'atteint que par la passerelle, en HTTPS
  # et derrière sa clé — publier 8091 offrirait un second chemin, en clair,
  # que rien ne surveillerait.
  atelier:
    build: ./.docker/service-atelier
    profiles: ["atelier"]
    depends_on:
      - installateur
    environment:
      ATELIER_CLE_API: ${ATELIER_CLE_API:-}
      INSTALLATEUR_URL: http://installateur:8090
      INSTALLATEUR_CLE_API: ${INSTALLATEUR_CLE_API:-cle-de-developpement}
      # Le service parle au modèle : la clé vit ici, jamais dans l'interface.
      BUILDER_IA_CLE: ${BUILDER_IA_CLE:-}
      BUILDER_IA_URL: ${BUILDER_IA_URL:-}
      BUILDER_IA_MODELE: ${BUILDER_IA_MODELE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      # Liste blanche d'origines. Jamais « * » avec une clé d'API.
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:-}
    volumes:
      # Le Builder est monté, pas copié : le service et la ligne de commande
      # exécutent les mêmes fichiers.
      - ./odoo-builder:/opt/odoo-builder:ro
    restart: unless-stopped

  # Passerelle HTTPS. Sous profil : « docker compose up » ne la démarre pas.
  #
  #   ATELIER_DOMAINE=atelier.exemple.fr \
  #     docker compose --profile passerelle up -d
  #
  # Elle est le seul service à publier des ports sur l'extérieur. Quand elle
  # tourne, Odoo n'a plus à être joignable directement : laisser BIND_ODOO sur
  # 127.0.0.1 revient à n'exposer que du HTTPS.
  passerelle:
    image: caddy:2-alpine
    profiles: ["passerelle"]
    depends_on:
      - odoo
    environment:
      ATELIER_DOMAINE: ${ATELIER_DOMAINE:-localhost}
      # Directive complète, pas seulement une adresse : voir le Caddyfile.
      ATELIER_ACME_EMAIL: ${ATELIER_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.docker/passerelle/Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats vivent ici. Sans ce volume, chaque recréation du
      # conteneur en redemanderait — et Let's Encrypt limite le nombre de
      # demandes par domaine et par semaine.
      - passerelle-data:/data
      - passerelle-config:/config
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
  addons-installes:
  passerelle-data:
  passerelle-config:
