# Instance Odoo 17 locale pour faire tourner les modules ANSUT.
#
# À la différence du workflow .github/workflows/test-install.yml, qui vérifie
# seulement que les modules s'installent puis s'arrête, cette pile reste
# allumée : interface accessible sur http://localhost:8069, base et filestore
# persistants entre deux démarrages.
#
# Voir DOCKER.md pour la mise en route et le branchement de l'atelier React.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      # N'écoute que sur la machine elle-même. Sur un serveur avec une IP
      # publique, « 8069:8069 » exposerait Odoo à Internet ; ici il faut un
      # tunnel SSH ou un proxy inverse devant, ce qui est le comportement
      # voulu. BIND_ADRESSE permet de l'ouvrir sciemment.
      - "${BIND_ADRESSE:-127.0.0.1}:8069:8069"
      # Communication temps réel (chatter, notifications)
      - "${BIND_ADRESSE:-127.0.0.1}:8072:8072"
    volumes:
      # Filestore et sessions : sans ce volume, les pièces jointes et la
      # session sont perdues à chaque recréation du conteneur.
      - odoo-data:/var/lib/odoo
      # Les modules du dépôt, en lecture seule : Odoo ne doit pas les modifier.
      - ./:/mnt/extra-addons:ro
      # Les modules déposés par le service d'installation. Volume distinct des
      # sources Git, et monté en lecture seule ici : seul le service écrit.
      - addons-installes:/mnt/addons-installes:ro
      - ./.docker/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

  # Service privé d'installation de modules. Sous profil : « docker compose
  # up » ne le démarre pas, il faut le demander explicitement par
  # « docker compose --profile installateur up -d installateur ».
  #
  # Il n'a délibérément pas accès au socket Docker : il écrit un volume et
  # parle HTTP à Odoo, rien de plus.
  installateur:
    build: ./.docker/service-installation
    profiles: ["installateur"]
    depends_on:
      - odoo
    environment:
      # À surcharger : le service refuse de démarrer sans clé.
      CLE_API: ${INSTALLATEUR_CLE_API:-cle-de-developpement}
      ODOO_URL: http://odoo:8069
      ODOO_BASE: ${INSTALLATEUR_BASE:-ansut}
      ODOO_LOGIN: admin
      ODOO_MOTDEPASSE: admin
      TAILLE_MAX_MO: "20"
    ports:
      # Le service d'installation installe du code : il ne doit jamais être
      # joignable depuis l'extérieur de la machine.
      - "${BIND_ADRESSE:-127.0.0.1}:8090:8090"
    volumes:
      - addons-installes:/mnt/addons-installes
      # Les sources Git en lecture seule : sert uniquement à refuser
      # l'écrasement d'un module livré par le dépôt.
      - ./:/mnt/extra-addons:ro
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
  addons-installes:
