name: Installation des modules dans Odoo 17

on: [push, pull_request]

jobs:
  install:
    runs-on: ubuntu-latest
    container: odoo:17
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Installer les modules ANSUT dans une base neuve
        run: |
          # Le conteneur tourne en root alors que l'image attend l'utilisateur
          # odoo : on écrit le répertoire de données dans le workspace plutôt
          # que dans /var/lib/odoo, dont les droits appartiennent à odoo.
          mkdir -p "$GITHUB_WORKSPACE/.odoo-data"
          odoo -d test_ansut --db_host=postgres --db_user=odoo --db_password=odoo \
            --data-dir="$GITHUB_WORKSPACE/.odoo-data" \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            -i diligence_simple,theme_backend,ansut_rh \
            --stop-after-init --without-demo=all --log-level=warn
