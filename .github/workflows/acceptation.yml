name: Acceptation — besoin en français vers module Odoo exécutable

# Le seul maillon qu'aucun autre contrôle ne couvre : l'appel réel au modèle.
# Les 123 tests du Builder prouvent le déterministe ; celui-ci prouve la
# chaîne entière, avec un vrai fournisseur, un vrai Odoo, une vraie base.
#
# Il consomme des jetons à chaque exécution. D'où l'absence de déclenchement à
# chaque poussée : seules les modifications du Builder ou de ce fichier le
# déclenchent.
#
# Prérequis, à faire une fois dans Settings → Secrets and variables → Actions :
#   secret   BUILDER_IA_CLE      la clé du fournisseur
#   variable BUILDER_IA_URL      point d'entrée (défaut : Moonshot)
#   variable BUILDER_IA_MODELE   nom du modèle (défaut : kimi-k3)
on:
  workflow_dispatch:
  push:
    branches:
      - claude/odoo-react-alchemy-handoff-hmig21
    paths:
      - 'odoo-builder/**'
      - '.docker/service-installation/**'
      - '.github/workflows/acceptation.yml'

jobs:
  acceptation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INSTALLATEUR_CLE_API: cle-de-recette-jetable
      # Fournisseur unique, utilisé quand aucun routeur n'est écrit.
      BUILDER_IA_CLE: ${{ secrets.BUILDER_IA_CLE }}
      BUILDER_IA_URL: ${{ vars.BUILDER_IA_URL || 'https://api.moonshot.ai/v1/chat/completions' }}
      BUILDER_IA_MODELE: ${{ vars.BUILDER_IA_MODELE || 'kimi-k3' }}
      # Clés nommées par le routeur. Il ne les contient jamais : il ne cite
      # que le nom de la variable qui les porte.
      KIMI_API_KEY: ${{ secrets.BUILDER_IA_CLE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sans clé, l'exécution s'arrête ici avec une raison lisible plutôt que
      # d'échouer plus loin sur un 401 qui ressemblerait à une régression.
      - name: Vérifier que la clé est déclarée
        run: |
          if [ -z "$BUILDER_IA_CLE" ]; then
            echo "::error::Le secret BUILDER_IA_CLE n'est pas déclaré."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Clé présente. Fournisseur : $BUILDER_IA_URL ($BUILDER_IA_MODELE)"

      - name: Démarrer la pile
        run: docker compose --profile installateur up -d --build

      - name: Créer la base
        run: |
          docker compose run --rm odoo odoo -d ansut -i base \
            --stop-after-init --log-level=warn
          docker compose --profile installateur up -d

      - name: Attendre qu'Odoo réponde
        run: |
          for _ in $(seq 1 90); do
            curl -sS -o /dev/null --max-time 3 http://127.0.0.1:8069/web/login && exit 0
            sleep 2
          done
          echo "::error::Odoo n'a pas répondu."
          exit 1

      # « gpt-5.6 » et « kimi-k3 » sont des noms de modèles que rien n'a jamais
      # vérifiés. Cette étape le fait dire au service lui-même plutôt que de
      # le supposer : si le modèle par défaut est refusé, elle imprime la liste
      # réellement disponible sur le compte. Informatif, jamais bloquant.
      - name: Reconnaître la clé OpenAI
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        env:
          BUILDER_IA_CLE: ${{ secrets.OPENAI_API_KEY }}
        run: python3 odoo-builder/cli/atelier_odoo.py providers detect

      # Deux fournisseurs déclarés valent un routeur : si le premier tombe, le
      # second prend la suite. Avec un seul, le repli sur l'environnement suffit
      # et le routeur n'apporterait rien qu'un fichier de plus.
      - name: Écrire le routeur, si plusieurs fournisseurs
        if: env.OPENAI_API_KEY != ''
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "odoo-builder/src")
          from ai.installation import ecrire_routeur
          chemin = ecrire_routeur(
              [("kimi", "kimi-k3"), ("openai", "gpt-4o")],
              "odoo-builder/routeur.json",
          )
          print(f"routeur écrit : {chemin}")
          PY
          echo "--- contenu (aucune clé, seulement des noms de variables) ---"
          cat odoo-builder/routeur.json

      # « --exigeant » quand un routeur est écrit : un secours qu'on n'exerce
      # jamais peut être cassé sans qu'on le sache, et le jour où le premier
      # fournisseur tombe, le routeur bascule vers rien.
      - name: Diagnostiquer les fournisseurs
        run: |
          if [ -f odoo-builder/routeur.json ]; then
            python3 odoo-builder/cli/atelier_odoo.py providers check --exigeant
          else
            python3 odoo-builder/cli/atelier_odoo.py providers check
          fi

      # « set -o pipefail » n'est pas un détail : sans lui, le tube rend le code
      # de sortie de « tee », toujours nul, et un job vert affiche un verdict
      # rouge sans que rien n'échoue. Une recette qui ment sur son résultat est
      # pire que pas de recette.
      - name: Jouer l'acceptation
        run: |
          set -o pipefail
          python3 odoo-builder/cli/acceptation.py | tee /tmp/acceptation.log

      # Seulement en cas d'échec : quand tout passe, ces 150 lignes ne servent
      # qu'à enterrer le verdict.
      - name: Journaux des conteneurs, en cas d'échec
        if: failure()
        run: |
          echo "===== odoo ====="
          docker compose logs --tail=120 odoo || true
          echo "===== installateur ====="
          docker compose logs --tail=30 installateur || true

      # Le verdict, seul et en dernier. Sans cela il est enseveli sous les
      # journaux des conteneurs, et le relire coûte de parcourir tout le fichier.
      - name: Rappeler le verdict
        if: always()
        run: |
          echo "===== compte rendu d'acceptation ====="
          cat /tmp/acceptation.log 2>/dev/null || echo "(le test n'a pas produit de compte rendu)"

      - name: Conserver le compte rendu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptation
          path: /tmp/acceptation.log
          if-no-files-found: ignore
