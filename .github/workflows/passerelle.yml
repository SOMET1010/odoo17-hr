name: Passerelle HTTPS

# La passerelle est la condition d'existence du raccordement à l'interface :
# un navigateur sur une page HTTPS refuse d'appeler un backend en clair. Elle
# est donc éprouvée comme le reste — sur le chemin réel, TLS compris.
#
# « localhost » est signé par l'autorité interne de Caddy : le certificat est
# vérifié avec sa racine, jamais contourné. Aucune dépendance à Let's Encrypt,
# ni à un nom public.
on:
  workflow_dispatch:
  push:
    paths:
      - '.docker/passerelle/**'
      - '.docker/verifier-passerelle.sh'
      - 'docker-compose.yml'
      - '.github/workflows/passerelle.yml'

jobs:
  passerelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Jouer la recette de la passerelle
        run: |
          chmod +x .docker/verifier-passerelle.sh
          ./.docker/verifier-passerelle.sh

      - name: Journaux, en cas d'échec
        if: failure()
        run: |
          echo "===== passerelle ====="
          docker compose logs --tail=100 passerelle || true
          echo "===== odoo ====="
          docker compose logs --tail=80 odoo || true
