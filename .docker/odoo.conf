[options]
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Les modules du dépôt s'ajoutent aux modules communautaires de l'image.
; /mnt/addons-installes reçoit les modules déposés par le service
; d'installation : il est séparé des sources Git, qui restent en lecture seule.
;
; /mnt/entreprise vient EN PREMIER : quand des addons Enterprise sont fournis,
; leurs versions doivent l'emporter sur celles de l'édition communautaire.
; Le chemin existe toujours — un dossier vide y est monté à défaut — sinon
; Odoo refuserait de démarrer chez qui n'a pas d'abonnement.
addons_path = /mnt/entreprise,/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/addons-installes

data_dir = /var/lib/odoo

; Le gestionnaire de bases permet de créer, dupliquer et SUPPRIMER des bases
; depuis le navigateur. Il n'a aucune utilité ici : la recette crée la base en
; ligne de commande, et le service d'installation passe par JSON-RPC. On le
; désactive plutôt que de le protéger par un mot de passe.
list_db = False
admin_passwd = $pbkdf2-sha512$non-utilise-gestionnaire-desactive

; Instance de développement : rechargement des vues sans redémarrage.
dev_mode = reload,qweb,xml
log_level = info
