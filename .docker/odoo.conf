[options]
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Les modules du dépôt s'ajoutent aux modules communautaires de l'image.
; /mnt/addons-installes reçoit les modules déposés par le service
; d'installation : il est séparé des sources Git, qui restent en lecture seule.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/addons-installes

data_dir = /var/lib/odoo

; Mot de passe de la page de gestion des bases (création, duplication).
admin_passwd = admin

; Instance de développement : rechargement des vues sans redémarrage.
dev_mode = reload,qweb,xml
log_level = info
