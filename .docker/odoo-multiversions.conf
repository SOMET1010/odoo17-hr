[options]
; Configuration du banc d'essai multi-versions. À ne pas confondre avec
; .docker/odoo.conf, qui est celle de l'instance de travail.
;
; Une seule différence, mais elle est décisive : le dépôt N'EST PAS sur le
; chemin d'addons.
;
; Le dépôt est une base de code Odoo 17 — ses modules déclarent « 17.0.x.y.z ».
; Odoo 18 refuse une version dont la série n'est pas la sienne :
;
;     ValueError: Module ansut_rh: invalid manifest
;       ← Invalid version '17.0.1.0.0'. Modules should have a version in
;         format `x.y`, `x.y.z`, `18.0.x.y` or `18.0.x.y.z`.
;
; et ce refus n'arrive pas à l'installation du module : il arrive à
; l'initialisation de la base, parce qu'Odoo lit TOUS les manifestes du chemin
; d'addons avant de créer quoi que ce soit. Un seul module d'une autre série
; suffit à empêcher Odoo 18 de démarrer.
;
; Ce n'est pas une gêne du banc d'essai, c'est un fait de migration : le jour
; où ces modules devront tourner en 18, leur version devra être réécrite. Le
; banc, lui, éprouve les modules GÉNÉRÉS ; il ne doit donc porter que le
; nécessaire — les addons d'Odoo et le dépôt de l'Atelier.

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/addons-installes

data_dir = /var/lib/odoo

list_db = False
admin_passwd = $pbkdf2-sha512$non-utilise-gestionnaire-desactive

log_level = info
